name: Source report
description: A game's download source doesn't work, like a deleted file, a page that never lets the download start, or the wrong file.
title: "[Source] "
labels: ["catalog"]
body:
  - type: markdown
    attributes:
      value: |
        One report per game. If several sources of the same game fail, list them all here. Sources are third-party hosts: files get deleted and pages change, so a source that worked last week can stop working.

  - type: input
    id: game
    attributes:
      label: Game
      description: The name exactly as it appears in Overdrive.
      placeholder: Ratchet & Clank Rift Apart
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: The name on the source's button in the game page.
      placeholder: Fpkg - VikingFile
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - VikingFile
        - DataNodes
        - FileKeeper
        - AkiraBox
        - MediaFire
        - Archive.org
        - LinkVault
        - Other (write it in the details)
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What happens?
      options:
        - The host says the file was deleted or not found
        - The browser page opens but the download is never captured
        - The download starts but fails or stops
        - The download finishes but it's the wrong file or game
        - The host is blocked in my country
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, and any error message the app or the host's page showed.
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      description: Some hosts block some countries, so this helps tell a blocked host from a dead file.
      placeholder: Italy

  - type: input
    id: version
    attributes:
      label: Overdrive version
      placeholder: v1.0.5
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Right after it happens, copy `/data/ps5-react/PPSA99058/app.log` over FTP and paste it here.
      render: text
